server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: msme-erp-backend

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Kolkata

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    registration-token-expiration-ms: ${JWT_REGISTRATION_TOKEN_EXPIRATION_MS:1800000}
    invite-token-expiration-ms: ${JWT_INVITE_TOKEN_EXPIRATION_MS:259200000}
    password-reset-token-expiration-ms: ${JWT_PASSWORD_RESET_TOKEN_EXPIRATION_MS:1800000}
  aws:
    region: ${AWS_REGION}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM}
  portal:
    base-domain: ${PORTAL_BASE_DOMAIN:msmeerp.com}
    scheme: ${PORTAL_SCHEME:https}
  frontend:
    # Leave empty in production: emailed links go to https://<workspace>.<base-domain>.
    # Set to e.g. http://localhost:5173 locally so links open your dev server.
    url: ${FRONTEND_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
  multitenancy:
    header-name: X-Tenant-ID
    default-tenant: msmeerp-main
